name: Build JoyRide Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable 64-bit release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile

      - name: Generate the Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Build APK with the app bundle embedded
        working-directory: frontend/android
        run: ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: JoyRide-APK-64bit
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
